<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>잿빛 지하묘</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      color: #eee9d9;
      background: radial-gradient(ellipse at 50% 0, #27352d, #101413 72%);
      font: 1rem/1.5 system-ui, sans-serif;
    }

    main { width: min(100%, 42rem); }

    h1 {
      margin: 0 0 .75rem;
      font-size: clamp(1.75rem, 5vw, 2.75rem);
      line-height: 1.2;
    }

    .controls-hint { margin: .75rem 0 0; color: #b8c0b5; }

    .experience-slots {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: .25rem;
      max-width: 20rem;
      margin-top: .3rem;
    }

    .experience-slot {
      height: .65rem;
      border: 1px solid #52606a;
      border-radius: .15rem;
      background: #202a32;
    }

    .experience-slot.is-filled { background: #61bcff; }

    /* 지도에서 정한 열 수에 맞춰 정사각형 타일을 위에서 아래로 배치합니다. */
    .room {
      --room-padding: .375rem;
      position: relative;
      display: grid;
      grid-template-columns: repeat(var(--columns), minmax(0, 1fr));
      padding: var(--room-padding);
      border: 1px solid #4a564e;
      border-radius: .5rem;
      background: #171e1a;
    }

    .tile { aspect-ratio: 1; }

    .floor {
      border: 1px solid #26302a;
      background: #333f36;
    }

    .floor:nth-child(even) { background: #2e3a32; }

    .wall {
      border: 1px solid #222c26;
      background: linear-gradient(#4b584e 0 10%, #3d4940 10% 75%, #28322b 75%);
    }

    .door {
      display: grid;
      place-items: center;
      border: 1px solid #261c12;
      background:
        linear-gradient(transparent 58%, #b78a53 58% 68%, transparent 68%),
        repeating-linear-gradient(90deg, #775334 0 25%, #65462d 25% 50%);
      box-shadow: inset 0 0 0 2px #a17c4c;
    }

    .door::after {
      width: 12%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #eac485;
      content: "";
    }

    /* 기준 요소를 한 타일 크기로 맞추면 100%만큼 움직일 때 정확히 한 칸 이동합니다. */
    .actor-anchor {
      position: absolute;
      top: var(--room-padding);
      left: var(--room-padding);
      width: calc((100% - 2 * var(--room-padding)) / var(--columns));
      aspect-ratio: 1;
      border: 1px solid transparent;
      z-index: 1;
      pointer-events: none;
    }

    .player-anchor {
      z-index: 2;
      will-change: transform;
    }

    .player {
      position: absolute;
      inset: 5%;
    }

    .player::before {
      position: absolute;
      inset: 55% 22% 0;
      border: 1px solid #302340;
      border-radius: 45% 45% 25% 25%;
      background: #8060b1;
      box-shadow: 0 2px #202722;
      content: "";
    }

    .player-hood {
      position: absolute;
      inset: 0 12% 24%;
      border: 1px solid #302340;
      border-radius: 50% 50% 42% 42%;
      background: #a688df;
    }

    .player-face {
      position: absolute;
      inset: 21% 12% 10%;
      border-radius: 46%;
      background: #ffdea8;
    }

    .player-eye {
      position: absolute;
      top: 24%;
      width: 29%;
      height: 39%;
      border-radius: 50%;
      background: radial-gradient(circle at 52% 52%, #302339 0 30%, #fff8e8 38%);
    }

    .player-eye:first-child { left: 14%; }
    .player-eye:last-child { right: 14%; }

    .player-face::after {
      position: absolute;
      inset: 65% 40% 9%;
      border-radius: 50%;
      background: #663746;
      content: "";
    }

    .player::after {
      position: absolute;
      inset: 10% 4% 64% 79%;
      transform: rotate(20deg);
      border-radius: 65% 0 65% 65%;
      background: #a2e7fa;
      content: "";
    }

    .monster {
      position: absolute;
      inset: 5% 8%;
    }

    .monster::before,
    .monster::after {
      position: absolute;
      top: 0;
      width: 36%;
      height: 45%;
      background: #f0a093;
      clip-path: polygon(0 0, 100% 68%, 20% 100%);
      content: "";
    }

    .monster::before { left: 4%; }
    .monster::after { right: 4%; transform: scaleX(-1); }

    .monster-face {
      position: absolute;
      inset: 22% 0 0;
      z-index: 1;
      border: 1px solid #43182a;
      border-radius: 48% 48% 40% 40%;
      background: linear-gradient(#e27287, #a73a5b);
      box-shadow: 0 2px #261c24;
    }

    .monster-eye {
      position: absolute;
      top: 27%;
      width: 29%;
      height: 27%;
      border-radius: 32% 18% 60% 58%;
      background: radial-gradient(ellipse at center, #451b29 0 26%, #ffe0a0 35%);
    }

    .monster-eye:first-child { left: 15%; transform: rotate(18deg); }
    .monster-eye:nth-child(2) { right: 15%; transform: rotate(-18deg); }

    .monster-mouth {
      position: absolute;
      inset: 59% 23% 12%;
      border-radius: 30% 30% 55% 55%;
      background: #401829;
    }

    .monster-mouth::before,
    .monster-mouth::after {
      position: absolute;
      top: 0;
      width: 27%;
      height: 66%;
      background: #fff4d4;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      content: "";
    }

    .monster-mouth::before { left: 14%; }
    .monster-mouth::after { right: 14%; }

    .room { cursor: crosshair; }

    .attack-effect { z-index: 3; }

    .experience-orb::before {
      position: absolute;
      inset: 32%;
      border-radius: 50%;
      background: radial-gradient(circle at 36% 30%, #e3faff, #57beff 48%, #1e52b7);
      box-shadow: 0 0 .55rem #3caaff;
      content: "";
    }

    .attack-warning {
      position: absolute;
      top: 50%;
      left: 50%;
      border: 2px solid #ffd183;
      border-radius: .25rem;
      background: repeating-linear-gradient(135deg, #ff9f3b52 0 5px, #ff9f3b24 5px 10px);
      box-shadow: 0 0 .35rem #ff9f3b78;
    }

    .monster.is-winding-up {
      transform: scale(1.17, .81);
      filter: brightness(1.42);
    }

    @media (prefers-reduced-motion: reduce) {
      .monster.is-winding-up { transform: none; }
    }

    .attack-swipe {
      position: absolute;
      inset: -16%;
      opacity: 0;
      filter: drop-shadow(0 0 .25rem #ff973e);
    }

    .attack-swipe::before,
    .attack-swipe::after {
      position: absolute;
      content: "";
    }

    .attack-swipe.is-thrust::before {
      clip-path: polygon(0 46%, 71% 40%, 71% 29%, 100% 50%, 71% 71%, 71% 60%, 0 54%);
    }

    .attack-swipe::before {
      inset: 0;
      background: linear-gradient(90deg, #f58a3d, #ffdc80 55%, #fff9da 76%, #ffbd5d);
      clip-path: polygon(24% 2%, 58% 12%, 79% 29%, 89% 50%, 79% 71%, 58% 88%, 24% 98%, 47% 78%, 63% 60%, 68% 50%, 63% 40%, 47% 22%);
    }

    .attack-swipe::after {
      inset: 25% 0 25% 61%;
      background: #fff7c2;
      clip-path: polygon(50% 0, 59% 39%, 100% 50%, 59% 61%, 50% 100%, 41% 61%, 0 50%, 41% 39%);
    }
  </style>
</head>
<body>
  <main>
    <h1>잿빛 지하묘</h1>
    <div id="room" class="room" role="img" aria-label="북쪽 중앙에 문이 있고, 모험가와 뿔 달린 작은 몬스터가 있는 돌 던전 방"></div>
    <p class="controls-hint">WASD로 이동하고, 던전 안을 왼쪽 클릭해 공격하세요. 연속으로 클릭하면 베기, 반대 베기, 찌르기가 이어집니다. 주황색 공격 범위는 옆으로 피할 수 있습니다.</p>
    <p class="controls-hint" role="status">플레이어 체력 <span id="health">6 / 6</span> · 몬스터 체력 <span id="monster-health">100 / 100</span> · <span id="monster-state">정찰</span></p>
    <p class="controls-hint" role="status">경험치 <span id="experience-count">0 / 10</span></p>
    <div id="experience-slots" class="experience-slots" aria-hidden="true"></div>
  </main>

  <template id="player-template">
    <div class="actor-anchor player-anchor">
      <div class="player">
        <div class="player-hood">
          <div class="player-face">
            <span class="player-eye"></span>
            <span class="player-eye"></span>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template id="monster-template">
    <div class="actor-anchor">
      <div class="monster">
        <div class="monster-face">
          <span class="monster-eye"></span>
          <span class="monster-eye"></span>
          <span class="monster-mouth"></span>
        </div>
      </div>
    </div>
  </template>

  <script>
    'use strict';

    // 배열의 한 줄은 지도의 가로 한 줄이고, 문자 하나는 타일 한 칸입니다.
    // 위치는 roomMap[y][x]로 읽습니다. x와 y는 왼쪽 위에서 0부터 시작합니다.
    // 모든 줄의 길이를 같게 유지하고, 문자만 바꾸면 방의 배치를 수정할 수 있습니다.
    const roomMap = [
      '######D######',
      '#...........#',
      '#..#.....#..#',
      '#...........#',
      '#...........#',
      '#..#.....#..#',
      '#...........#',
      '#...........#',
      '#############',
    ];

    // 지도 기호에 대응하는 CSS 클래스를 한곳에서 관리합니다.
    const tileTypes = { '#': 'wall', '.': 'floor', D: 'door' };
    const room = document.getElementById('room');
    room.style.setProperty('--columns', roomMap[0].length);

    // 바깥 반복문은 행을, 안쪽 반복문은 그 행의 칸을 순회합니다.
    // 지도 데이터를 읽어 화면 요소를 만드는 과정을 렌더링이라고 합니다.
    for (const row of roomMap) {
      for (const symbol of row) {
        const tile = document.createElement('div');
        tile.classList.add('tile', tileTypes[symbol]);
        room.append(tile);
      }
    }

    function isFloor(x, y) {
      return roomMap[y]?.[x] === '.';
    }

    const playerPosition = { x: 6, y: 7 };
    if (!isFloor(playerPosition.x, playerPosition.y)) {
      throw new Error('캐릭터 시작 위치는 바닥 타일이어야 합니다.');
    }

    const playerTemplate = document.getElementById('player-template');
    const playerAnchor = playerTemplate.content.firstElementChild.cloneNode(true);
    const playerSprite = playerAnchor.firstElementChild;
    room.append(playerAnchor);
    renderPlayer();

    const monsterPosition = { x: 8, y: 3 };
    if (!isFloor(monsterPosition.x, monsterPosition.y)) {
      throw new Error('몬스터 위치는 바닥 타일이어야 합니다.');
    }

    const monsterTemplate = document.getElementById('monster-template');
    const monsterAnchor = monsterTemplate.content.firstElementChild.cloneNode(true);
    const monsterSprite = monsterAnchor.firstElementChild;
    renderActor(monsterAnchor, monsterPosition.x, monsterPosition.y);
    room.append(monsterAnchor);

    const attackEffect = document.createElement('div');
    attackEffect.classList.add('actor-anchor', 'attack-effect');
    attackEffect.setAttribute('aria-hidden', 'true');
    const attackWarning = document.createElement('div');
    attackWarning.classList.add('attack-warning');
    attackWarning.hidden = true;
    const attackSwipe = document.createElement('div');
    attackSwipe.classList.add('attack-swipe');
    attackEffect.append(attackWarning, attackSwipe);
    room.append(attackEffect);

    const playerAttackEffect = attackEffect.cloneNode(false);
    const playerAttackSwipe = attackSwipe.cloneNode(false);
    playerAttackEffect.append(playerAttackSwipe);
    room.append(playerAttackEffect);

    const monsterStates = { scout: '정찰', chase: '추적', attack: '공격' };
    const patrolRoute = [{ x: 10, y: 3 }, { x: 10, y: 6 }, { x: 7, y: 6 }, { x: 7, y: 3 }];
    const scoutSpeed = 1.5;
    const chaseSpeed = 4;
    const detectionRange = 4;
    const disengageRange = 5;
    const attackRange = 1.2;
    const attackHalfWidth = 0.43;
    const attackWindupMs = 300;
    const attackIntervalMs = 900;
    const knockbackDistance = 0.9;
    const knockbackDurationMs = 200;
    const maxHealth = 6;
    const monsterMaxHealth = 100;
    const experienceCapacity = 10;
    const orbPickupRange = 0.36;
    const orbMagnetDelayMs = 250;
    const orbMagnetSpeed = 7;
    const playerAttackDamage = 20;
    const playerAttackRange = 1.5;
    const comboWindowMs = 700;
    const playerAttackCooldownMs = 300;
    const healthStatus = document.getElementById('health');
    const monsterHealthStatus = document.getElementById('monster-health');
    const monsterStatus = document.getElementById('monster-state');
    const experienceCount = document.getElementById('experience-count');
    const experienceSlots = document.getElementById('experience-slots');
    for (let index = 0; index < experienceCapacity; index += 1) {
      const slot = document.createElement('span');
      slot.classList.add('experience-slot');
      experienceSlots.append(slot);
    }
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let health = maxHealth;
    let monsterHealth = monsterMaxHealth;
    let experience = 0;
    let experienceOrb;
    let monsterState = 'scout';
    let patrolIndex = 0;
    let monsterWaypoint;
    let attackCooldownMs = 0;
    let pendingAttack;
    let knockback;
    let monsterKnockback;
    let comboStep = 0;
    let lastPlayerAttackAt = -Infinity;
    let playerAttackAnimations = [];

    const movementByKey = new Map([
      ['w', { dx: 0, dy: -1 }],
      ['s', { dx: 0, dy: 1 }],
      ['a', { dx: -1, dy: 0 }],
      ['d', { dx: 1, dy: 0 }],
    ]);

    const heldKeys = new Set();
    const playerSpeed = 6; // 초당 타일 수
    const movementResponseMs = 40;
    const actorHalfSize = 0.28;
    const wallGap = 0.0001;
    const maxFrameElapsedMs = 50;
    const stopSpeed = 0.02;
    const velocity = { x: 0, y: 0 };
    let queuedKey;
    let previousFrameTime = performance.now();

    function getInputDirection() {
      const activeKeys = new Set(heldKeys);
      if (queuedKey) activeKeys.add(queuedKey);
      queuedKey = undefined;

      let dx = 0;
      let dy = 0;
      for (const key of activeKeys) {
        const movement = movementByKey.get(key);
        dx += movement.dx;
        dy += movement.dy;
      }
      const length = Math.hypot(dx, dy) || 1;
      return { x: dx / length, y: dy / length };
    }

    function moveAlongAxis(position, axis, displacement) {
      if (displacement === 0) return true;

      const next = position[axis] + displacement;
      const direction = Math.sign(displacement);
      const otherAxis = axis === 'x' ? 'y' : 'x';
      // 좌표 0은 첫 타일의 중심이므로, 타일 경계 기준으로 바꾸려면 0.5를 더합니다.
      const frontTile = Math.floor(next + 0.5 + direction * actorHalfSize);
      const crossCenter = position[otherAxis] + 0.5;
      const crossStart = Math.floor(crossCenter - actorHalfSize);
      const crossEnd = Math.floor(crossCenter + actorHalfSize);
      const canMove = axis === 'x'
        ? isFloor(frontTile, crossStart) && isFloor(frontTile, crossEnd)
        : isFloor(crossStart, frontTile) && isFloor(crossEnd, frontTile);

      if (canMove) {
        position[axis] = next;
        return true;
      }

      // 막힌 축만 벽 경계에 맞춰 멈추면, 열린 축으로 벽을 따라 이동할 수 있습니다.
      const wallEdge = direction > 0 ? frontTile : frontTile + 1;
      position[axis] = wallEdge - 0.5 - direction * (actorHalfSize + wallGap);
      return false;
    }

    function renderActor(anchor, x, y) {
      anchor.style.transform = `translate3d(${x * 100}%, ${y * 100}%, 0)`;
    }

    function renderPlayer() {
      renderActor(playerAnchor, playerPosition.x, playerPosition.y);
    }

    function tileOf(position) {
      return { x: Math.round(position.x), y: Math.round(position.y) };
    }

    function sameTile(a, b) {
      return a.x === b.x && a.y === b.y;
    }

    function findNextWaypoint(start, goal) {
      const queue = [{ ...start, firstStep: null }];
      const keyOf = ({ x, y }) => y * roomMap[0].length + x;
      const visited = new Set([keyOf(start)]);

      // 가까운 칸부터 탐색해 목표로 가는 최단 경로의 첫 칸을 고릅니다.
      for (let index = 0; index < queue.length; index += 1) {
        const tile = queue[index];
        for (const { dx, dy } of movementByKey.values()) {
          const next = { x: tile.x + dx, y: tile.y + dy };
          if (!isFloor(next.x, next.y) || visited.has(keyOf(next))) continue;
          const firstStep = tile.firstStep ?? next;
          if (sameTile(next, goal)) return firstStep;
          visited.add(keyOf(next));
          queue.push({ ...next, firstStep });
        }
      }
    }

    function moveMonsterToward(target, maxDistance) {
      if (!monsterWaypoint) {
        const start = tileOf(monsterPosition);
        const goal = tileOf(target);
        if (!sameTile(start, goal)) monsterWaypoint = findNextWaypoint(start, goal);
        if (!monsterWaypoint && !sameTile(start, goal)) return;
      }

      const destination = monsterWaypoint ?? target;
      const dx = destination.x - monsterPosition.x;
      const dy = destination.y - monsterPosition.y;
      const distance = Math.hypot(dx, dy);
      const fraction = distance > maxDistance ? maxDistance / distance : 1;
      const movedX = moveAlongAxis(monsterPosition, 'x', dx * fraction);
      const movedY = moveAlongAxis(monsterPosition, 'y', dy * fraction);
      if (fraction === 1 && movedX && movedY) monsterWaypoint = undefined;
    }

    function getMonsterState(distance, hasOpenAttack) {
      if (pendingAttack || (distance <= attackRange && hasOpenAttack)) return 'attack';
      const range = monsterState === 'scout' ? detectionRange : disengageRange;
      return distance <= range ? 'chase' : 'scout';
    }

    function beginMonsterAttack(distance) {
      const dx = distance === 0 ? 0 : (playerPosition.x - monsterPosition.x) / distance;
      const dy = distance === 0 ? 1 : (playerPosition.y - monsterPosition.y) / distance;
      pendingAttack = { dx, dy, remainingMs: attackWindupMs };
      attackCooldownMs = attackIntervalMs;

      // 예고 표시와 실제 판정에 같은 사거리와 폭을 사용합니다.
      renderActor(attackEffect, monsterPosition.x + dx * attackRange / 2,
        monsterPosition.y + dy * attackRange / 2);
      attackWarning.style.width = `${attackRange * 100}%`;
      attackWarning.style.height = `${attackHalfWidth * 200}%`;
      attackWarning.style.transform = `translate(-50%, -50%) rotate(${Math.atan2(dy, dx)}rad)`;
      attackWarning.hidden = false;
      monsterSprite.classList.add('is-winding-up');
      monsterStatus.textContent = '공격 준비';
    }

    function playPlayerAttackMotion(dx, dy, combo) {
      const aim = Math.atan2(dy, dx);
      const angle = `rotate(${aim}rad)`;
      const thrust = combo === 3;
      const sweep = reducedMotion.matches || thrust ? 0 : (combo === 1 ? 0.85 : -0.85);
      const swipeAnimation = playerAttackSwipe.animate([
        { transform: `rotate(${aim - sweep}rad) scale(${reducedMotion.matches || thrust ? 1 : 0.8})`, opacity: 0 },
        { transform: angle, opacity: 1, offset: 0.18 },
        { transform: `rotate(${aim + sweep}rad)`, opacity: 1, offset: 0.55 },
        { transform: `rotate(${aim + sweep}rad)`, opacity: 0 },
      ], { duration: 400, easing: 'ease-out' });

      const rest = { transform: 'none', filter: 'brightness(1)' };
      const strike = {
        offset: 0.24,
        transform: reducedMotion.matches ? 'none' : `translate(${dx * (thrust ? 68 : 50)}%, ${dy * (thrust ? 68 : 50)}%) scale(1.12)`,
        filter: 'brightness(1.34)',
      };
      return [swipeAnimation, playerSprite.animate([rest, strike, rest], { duration: 260, easing: 'ease-out' })];
    }

    function playMonsterAttackMotion(dx, dy) {
      const angle = `rotate(${Math.atan2(dy, dx)}rad)`;
      attackSwipe.animate([
        { transform: `${angle} scale(${reducedMotion.matches ? 1 : 0.8})`, opacity: 0 },
        { transform: angle, opacity: 1, offset: 0.18 },
        { transform: angle, opacity: 1, offset: 0.55 },
        { transform: angle, opacity: 0 },
      ], { duration: 340, easing: 'ease-out' });

      const rest = { transform: 'none', filter: 'brightness(1)' };
      const strike = {
        offset: 0.24,
        transform: reducedMotion.matches ? 'none' : `translate(${dx * 50}%, ${dy * 50}%) scale(1.12)`,
        filter: 'brightness(1.34)',
      };
      monsterSprite.animate([rest, strike, rest], { duration: 260, easing: 'ease-out' });
    }

    function playHitMotion(sprite) {
      const rest = { transform: 'none', filter: 'brightness(1)' };
      const flinch = {
        offset: 0.24,
        transform: reducedMotion.matches ? 'none' : 'scale(0.88)',
        filter: 'brightness(1.55)',
      };

      sprite.animate([rest, flinch, rest], { duration: 260, easing: 'ease-out' });
    }

    function hitPlayer(dx, dy) {
      knockback = { dx, dy, elapsed: 0 };
      velocity.x = 0;
      velocity.y = 0;
      playHitMotion(playerSprite);
      health -= 1;
      healthStatus.textContent = `${health} / ${maxHealth}`;
      if (health === 0) monsterStatus.textContent = '승리 · 새로고침으로 다시 시작';
    }

    function updateMonsterAttack(elapsed, distance, hasOpenAttack) {
      if (!pendingAttack) {
        if (attackCooldownMs === 0) beginMonsterAttack(distance);
        return;
      }

      pendingAttack.remainingMs -= elapsed;
      if (pendingAttack.remainingMs > 0) return;

      const { dx, dy } = pendingAttack;
      pendingAttack = undefined;
      attackWarning.hidden = true;
      monsterSprite.classList.remove('is-winding-up');
      playMonsterAttackMotion(dx, dy);

      // 조준 방향은 예고 때 고정하고, 타격 순간의 플레이어 위치만 검사합니다.
      const offsetX = playerPosition.x - monsterPosition.x;
      const offsetY = playerPosition.y - monsterPosition.y;
      const forward = offsetX * dx + offsetY * dy;
      const sideways = offsetY * dx - offsetX * dy;
      const hit = hasOpenAttack && forward >= 0 && forward <= attackRange && Math.abs(sideways) <= attackHalfWidth;
      monsterStatus.textContent = hit ? '공격' : '공격 빗나감';
      if (hit) hitPlayer(dx, dy);
    }

    function updateKnockback(position, push, elapsed) {
      const remainingBefore = 1 - push.elapsed / knockbackDurationMs;
      push.elapsed = Math.min(push.elapsed + elapsed, knockbackDurationMs);
      const remainingAfter = 1 - push.elapsed / knockbackDurationMs;
      // 처음에 멀리 밀리고, 시간이 갈수록 프레임당 이동 거리가 줄어듭니다.
      const distance = knockbackDistance * (remainingBefore ** 2 - remainingAfter ** 2);
      if (!moveAlongAxis(position, 'x', push.dx * distance)) push.dx = 0;
      if (!moveAlongAxis(position, 'y', push.dy * distance)) push.dy = 0;
      const finished = remainingAfter === 0 || (push.dx === 0 && push.dy === 0);
      return finished ? undefined : push;
    }

    function hasOpenAttackPath() {
      const playerTile = tileOf(playerPosition);
      const monsterTile = tileOf(monsterPosition);
      return isFloor(playerTile.x, monsterTile.y) && isFloor(monsterTile.x, playerTile.y);
    }

    function resetExpiredCombo(now) {
      if (comboStep !== 0 && now - lastPlayerAttackAt > comboWindowMs) comboStep = 0;
    }

    function attackAtPointer(event) {
      if (event.button !== 0 || health === 0) return;
      const now = performance.now();
      if (now - lastPlayerAttackAt < playerAttackCooldownMs) return;

      resetExpiredCombo(now);
      comboStep = comboStep % 3 + 1;
      lastPlayerAttackAt = now;

      const bounds = playerAnchor.getBoundingClientRect();
      const aimX = event.clientX - (bounds.left + bounds.width / 2);
      const aimY = event.clientY - (bounds.top + bounds.height / 2);
      const aimLength = Math.hypot(aimX, aimY);
      const dx = aimLength === 0 ? 0 : aimX / aimLength;
      const dy = aimLength === 0 ? 1 : aimY / aimLength;

      for (const animation of playerAttackAnimations) animation.cancel();
      playerAttackSwipe.classList.toggle('is-thrust', comboStep === 3);
      renderActor(playerAttackEffect, playerPosition.x + dx * playerAttackRange / 2,
        playerPosition.y + dy * playerAttackRange / 2);
      playerAttackAnimations = playPlayerAttackMotion(dx, dy, comboStep);

      if (monsterHealth === 0) return;
      const offsetX = monsterPosition.x - playerPosition.x;
      const offsetY = monsterPosition.y - playerPosition.y;
      const distance = Math.hypot(offsetX, offsetY);
      if (distance > playerAttackRange || !hasOpenAttackPath()) return;
      const forward = offsetX * dx + offsetY * dy;
      const sideways = offsetY * dx - offsetX * dy;
      const halfWidth = comboStep === 3 ? 0.32 : 0.8;
      if (forward < 0 || Math.abs(sideways) > halfWidth) return;

      playHitMotion(monsterSprite);
      monsterKnockback = { dx: distance === 0 ? dx : offsetX / distance,
        dy: distance === 0 ? dy : offsetY / distance, elapsed: 0 };
      monsterWaypoint = undefined;
      pendingAttack = undefined;
      attackWarning.hidden = true;
      monsterSprite.classList.remove('is-winding-up');
      monsterHealth = Math.max(0, monsterHealth - playerAttackDamage);
      monsterHealthStatus.textContent = `${monsterHealth} / ${monsterMaxHealth}`;
      monsterStatus.textContent = monsterHealth === 0 ? '몬스터 처치' : '피격';
    }

    function updateMonster(elapsed) {
      attackCooldownMs = Math.max(0, attackCooldownMs - elapsed);
      const distance = Math.hypot(playerPosition.x - monsterPosition.x, playerPosition.y - monsterPosition.y);
      const hasOpenAttack = hasOpenAttackPath();
      const nextState = getMonsterState(distance, hasOpenAttack);
      if (nextState !== monsterState) {
        monsterState = nextState;
        monsterStatus.textContent = monsterStates[monsterState];
      }

      switch (monsterState) {
        case 'scout': {
          const target = patrolRoute[patrolIndex];
          moveMonsterToward(target, scoutSpeed * elapsed / 1000);
          if (sameTile(monsterPosition, target)) patrolIndex = (patrolIndex + 1) % patrolRoute.length;
          break;
        }
        case 'chase':
          moveMonsterToward(playerPosition, chaseSpeed * elapsed / 1000);
          break;
        case 'attack':
          updateMonsterAttack(elapsed, distance, hasOpenAttack);
          break;
      }
      renderActor(monsterAnchor, monsterPosition.x, monsterPosition.y);
    }

    function updatePlayerMovement(elapsed) {
      const direction = getInputDirection();
      const response = 1 - Math.exp(-elapsed / movementResponseMs);
      const seconds = elapsed / 1000;
      for (const axis of ['x', 'y']) {
        const targetSpeed = direction[axis] * playerSpeed;
        const previousSpeed = velocity[axis];
        velocity[axis] += (targetSpeed - previousSpeed) * response;
        if (targetSpeed === 0 && Math.abs(velocity[axis]) < stopSpeed) velocity[axis] = 0;
        const displacement = (previousSpeed + velocity[axis]) * seconds / 2;
        if (!moveAlongAxis(playerPosition, axis, displacement)) velocity[axis] = 0;
      }
    }

    function animateGame(frameTime) {
      resetExpiredCombo(frameTime);
      // 프레임이 오래 지연된 뒤 한꺼번에 이동하는 거리를 제한합니다.
      const elapsed = Math.max(0, Math.min(frameTime - previousFrameTime, maxFrameElapsedMs));
      previousFrameTime = frameTime;
      if (elapsed === 0) {
        requestAnimationFrame(animateGame);
        return;
      }

      if (knockback) knockback = updateKnockback(playerPosition, knockback, elapsed);
      else if (health > 0) updatePlayerMovement(elapsed);
      renderPlayer();
      if (monsterKnockback) {
        monsterKnockback = updateKnockback(monsterPosition, monsterKnockback, elapsed);
        renderActor(monsterAnchor, monsterPosition.x, monsterPosition.y);
        if (!monsterKnockback) {
          if (monsterHealth === 0) {
            monsterAnchor.hidden = true;
            dropExperienceOrb();
          }
          else monsterStatus.textContent = monsterStates[monsterState];
        }
      } else if (health > 0 && monsterHealth > 0) {
        updateMonster(elapsed);
      }
      if (health > 0 && experienceOrb) updateExperienceOrb(elapsed);
      if (health > 0 || knockback || monsterKnockback) requestAnimationFrame(animateGame);
    }

    function dropExperienceOrb() {
      const anchor = document.createElement('div');
      anchor.classList.add('actor-anchor', 'experience-orb');
      room.append(anchor);
      experienceOrb = { ...monsterPosition, anchor, ageMs: 0 };
      renderActor(anchor, experienceOrb.x, experienceOrb.y);
    }

    function updateExperienceOrb(elapsed) {
      const orb = experienceOrb;
      const dx = playerPosition.x - orb.x;
      const dy = playerPosition.y - orb.y;
      const distance = Math.hypot(dx, dy);
      orb.ageMs += elapsed;

      const pull = monsterHealth === 0 && orb.ageMs >= orbMagnetDelayMs
        ? orbMagnetSpeed * elapsed / 1000 : 0;
      if (distance <= orbPickupRange + pull) {
        experience = Math.min(experience + 1, experienceCapacity);
        experienceCount.textContent = `${experience} / ${experienceCapacity}`;
        experienceSlots.children[experience - 1].classList.add('is-filled');
        orb.anchor.remove();
        experienceOrb = undefined;
        return;
      }

      if (pull > 0) {
        orb.x += dx / distance * pull;
        orb.y += dy / distance * pull;
        renderActor(orb.anchor, orb.x, orb.y);
      }
    }

    room.addEventListener('click', attackAtPointer);

    document.addEventListener('keydown', (event) => {
      if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
      const key = event.key.toLowerCase();
      if (!movementByKey.has(key)) return;

      event.preventDefault();
      if (event.repeat) return;

      heldKeys.add(key);
      // 화면을 그리기 전에 키를 떼도 짧은 입력을 한 번 반영합니다.
      queuedKey = key;
    });

    document.addEventListener('keyup', (event) => {
      heldKeys.delete(event.key.toLowerCase());
    });

    window.addEventListener('blur', () => {
      heldKeys.clear();
      queuedKey = undefined;
      velocity.x = 0;
      velocity.y = 0;
    });

    requestAnimationFrame(animateGame);
  </script>
</body>
</html>

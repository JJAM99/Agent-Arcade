<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>잿빛 지하묘</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      color: #eee9d9;
      background: radial-gradient(ellipse at 50% 0, #27352d, #101413 72%);
      font: 1rem/1.5 system-ui, sans-serif;
    }

    main { width: min(100%, 42rem); }

    h1 {
      margin: 0 0 .75rem;
      font-size: clamp(1.75rem, 5vw, 2.75rem);
      line-height: 1.2;
    }

    /* 지도에서 정한 열 수에 맞춰 정사각형 타일을 위에서 아래로 배치합니다. */
    .room {
      display: grid;
      grid-template-columns: repeat(var(--columns), minmax(0, 1fr));
      padding: .375rem;
      border: 1px solid #4a564e;
      border-radius: .5rem;
      background: #171e1a;
    }

    .tile { aspect-ratio: 1; }

    .floor {
      position: relative;
      border: 1px solid #26302a;
      background: #333f36;
    }

    .floor:nth-child(even) { background: #2e3a32; }

    .wall {
      border: 1px solid #222c26;
      background: linear-gradient(#4b584e 0 10%, #3d4940 10% 75%, #28322b 75%);
    }

    .door {
      display: grid;
      place-items: center;
      border: 1px solid #261c12;
      background:
        linear-gradient(transparent 58%, #b78a53 58% 68%, transparent 68%),
        repeating-linear-gradient(90deg, #775334 0 25%, #65462d 25% 50%);
      box-shadow: inset 0 0 0 2px #a17c4c;
    }

    .door::after {
      width: 12%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #eac485;
      content: "";
    }

    /* 타일을 기준으로 배치해 화면이 작아져도 캐릭터가 같은 칸에 머뭅니다. */
    .player {
      position: absolute;
      inset: 5%;
    }

    .player::before {
      position: absolute;
      inset: 55% 22% 0;
      border: 1px solid #302340;
      border-radius: 45% 45% 25% 25%;
      background: #8060b1;
      box-shadow: 0 2px #202722;
      content: "";
    }

    .player-hood {
      position: absolute;
      inset: 0 12% 24%;
      border: 1px solid #302340;
      border-radius: 50% 50% 42% 42%;
      background: #a688df;
    }

    .player-face {
      position: absolute;
      inset: 21% 12% 10%;
      border-radius: 46%;
      background: #ffdea8;
    }

    .player-eye {
      position: absolute;
      top: 24%;
      width: 29%;
      height: 39%;
      border-radius: 50%;
      background: radial-gradient(circle at 52% 52%, #302339 0 30%, #fff8e8 38%);
    }

    .player-eye:first-child { left: 14%; }
    .player-eye:last-child { right: 14%; }

    .player-face::after {
      position: absolute;
      inset: 65% 40% 9%;
      border-radius: 50%;
      background: #663746;
      content: "";
    }

    .player::after {
      position: absolute;
      inset: 10% 4% 64% 79%;
      transform: rotate(20deg);
      border-radius: 65% 0 65% 65%;
      background: #a2e7fa;
      content: "";
    }
  </style>
</head>
<body>
  <main>
    <h1>잿빛 지하묘</h1>
    <div id="room" class="room" role="img" aria-label="북쪽 중앙에 문이 있고, 아래쪽 바닥에 겁먹은 보라색 후드의 모험가가 서 있는 돌 던전 방"></div>
  </main>

  <template id="player-template">
    <div class="player">
      <div class="player-hood">
        <div class="player-face">
          <span class="player-eye"></span>
          <span class="player-eye"></span>
        </div>
      </div>
    </div>
  </template>

  <script>
    'use strict';

    // 배열의 한 줄은 지도의 가로 한 줄이고, 문자 하나는 타일 한 칸입니다.
    // 위치는 roomMap[y][x]로 읽습니다. x와 y는 왼쪽 위에서 0부터 시작합니다.
    // 모든 줄의 길이를 같게 유지하고, 문자만 바꾸면 방의 배치를 수정할 수 있습니다.
    const roomMap = [
      '######D######',
      '#...........#',
      '#..#.....#..#',
      '#...........#',
      '#...........#',
      '#..#.....#..#',
      '#...........#',
      '#...........#',
      '#############',
    ];

    // 지도 기호에 대응하는 CSS 클래스를 한곳에서 관리합니다.
    const tileTypes = { '#': 'wall', '.': 'floor', D: 'door' };
    const room = document.getElementById('room');
    const columns = roomMap[0].length;
    room.style.setProperty('--columns', columns);

    // 바깥 반복문은 행을, 안쪽 반복문은 그 행의 칸을 순회합니다.
    // 지도 데이터를 읽어 화면 요소를 만드는 과정을 렌더링이라고 합니다.
    for (const row of roomMap) {
      for (const symbol of row) {
        const tile = document.createElement('div');
        tile.classList.add('tile', tileTypes[symbol]);
        room.append(tile);
      }
    }

    const playerStart = { x: 6, y: 7 };
    const { x, y } = playerStart;
    if (roomMap[y]?.[x] !== '.') {
      throw new Error('캐릭터 시작 위치는 바닥 타일이어야 합니다.');
    }

    // 앞선 행의 타일 수에 현재 열을 더하면 DOM에서 해당 타일을 찾을 수 있습니다.
    const startTile = room.children[y * columns + x];
    const playerTemplate = document.getElementById('player-template');
    startTile.append(playerTemplate.content.cloneNode(true));
  </script>
</body>
</html>

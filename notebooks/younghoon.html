<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>잿빛 지하묘</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      color: #eee9d9;
      background: radial-gradient(ellipse at 50% 0, #27352d, #101413 72%);
      font: 1rem/1.5 system-ui, sans-serif;
    }

    main { width: min(100%, 42rem); }

    h1 {
      margin: 0 0 .75rem;
      font-size: clamp(1.75rem, 5vw, 2.75rem);
      line-height: 1.2;
    }

    /* 지도에서 정한 열 수에 맞춰 정사각형 타일을 위에서 아래로 배치합니다. */
    .room {
      display: grid;
      grid-template-columns: repeat(var(--columns), minmax(0, 1fr));
      padding: .375rem;
      border: 1px solid #4a564e;
      border-radius: .5rem;
      background: #171e1a;
    }

    .tile { aspect-ratio: 1; }

    .floor {
      border: 1px solid #26302a;
      background: #333f36;
    }

    .floor:nth-child(even) { background: #2e3a32; }

    .wall {
      border: 1px solid #222c26;
      background: linear-gradient(#4b584e 0 10%, #3d4940 10% 75%, #28322b 75%);
    }

    .door {
      display: grid;
      place-items: center;
      border: 1px solid #261c12;
      background:
        linear-gradient(transparent 58%, #b78a53 58% 68%, transparent 68%),
        repeating-linear-gradient(90deg, #775334 0 25%, #65462d 25% 50%);
      box-shadow: inset 0 0 0 2px #a17c4c;
    }

    .door::after {
      width: 12%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #eac485;
      content: "";
    }
  </style>
</head>
<body>
  <main>
    <h1>잿빛 지하묘</h1>
    <div id="room" class="room" role="img" aria-label="돌바닥, 돌벽, 북쪽 중앙의 문으로 이루어진 던전 방"></div>
  </main>

  <script>
    'use strict';

    // 배열의 한 줄은 지도의 가로 한 줄이고, 문자 하나는 타일 한 칸입니다.
    // 위치는 roomMap[y][x]로 읽습니다. x와 y는 왼쪽 위에서 0부터 시작합니다.
    // 모든 줄의 길이를 같게 유지하고, 문자만 바꾸면 방의 배치를 수정할 수 있습니다.
    const roomMap = [
      '######D######',
      '#...........#',
      '#..#.....#..#',
      '#...........#',
      '#...........#',
      '#..#.....#..#',
      '#...........#',
      '#...........#',
      '#############',
    ];

    // 지도 기호에 대응하는 CSS 클래스를 한곳에서 관리합니다.
    const tileTypes = { '#': 'wall', '.': 'floor', D: 'door' };
    const room = document.getElementById('room');
    room.style.setProperty('--columns', roomMap[0].length);

    // 바깥 반복문은 행을, 안쪽 반복문은 그 행의 칸을 순회합니다.
    // 지도 데이터를 읽어 화면 요소를 만드는 과정을 렌더링이라고 합니다.
    for (const row of roomMap) {
      for (const symbol of row) {
        const tile = document.createElement('div');
        tile.classList.add('tile', tileTypes[symbol]);
        room.append(tile);
      }
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>잿빛 지하묘</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      color: #eee9d9;
      background: radial-gradient(ellipse at 50% 0, #27352d, #101413 72%);
      font: 1rem/1.5 system-ui, sans-serif;
    }

    main { width: min(100%, 42rem); }

    h1 {
      margin: 0 0 .75rem;
      font-size: clamp(1.75rem, 5vw, 2.75rem);
      line-height: 1.2;
    }

    .controls-hint { margin: .75rem 0 0; color: #b8c0b5; }

    /* 지도에서 정한 열 수에 맞춰 정사각형 타일을 위에서 아래로 배치합니다. */
    .room {
      --room-padding: .375rem;
      position: relative;
      display: grid;
      grid-template-columns: repeat(var(--columns), minmax(0, 1fr));
      padding: var(--room-padding);
      border: 1px solid #4a564e;
      border-radius: .5rem;
      background: #171e1a;
    }

    .tile { aspect-ratio: 1; }

    .floor {
      border: 1px solid #26302a;
      background: #333f36;
    }

    .floor:nth-child(even) { background: #2e3a32; }

    .wall {
      border: 1px solid #222c26;
      background: linear-gradient(#4b584e 0 10%, #3d4940 10% 75%, #28322b 75%);
    }

    .door {
      display: grid;
      place-items: center;
      border: 1px solid #261c12;
      background:
        linear-gradient(transparent 58%, #b78a53 58% 68%, transparent 68%),
        repeating-linear-gradient(90deg, #775334 0 25%, #65462d 25% 50%);
      box-shadow: inset 0 0 0 2px #a17c4c;
    }

    .door::after {
      width: 12%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #eac485;
      content: "";
    }

    /* 기준 요소를 한 타일 크기로 맞추면 100%만큼 움직일 때 정확히 한 칸 이동합니다. */
    .player-anchor {
      position: absolute;
      top: var(--room-padding);
      left: var(--room-padding);
      width: calc((100% - 2 * var(--room-padding)) / var(--columns));
      aspect-ratio: 1;
      border: 1px solid transparent;
      z-index: 1;
      pointer-events: none;
      will-change: transform;
    }

    .player {
      position: absolute;
      inset: 5%;
    }

    .player::before {
      position: absolute;
      inset: 55% 22% 0;
      border: 1px solid #302340;
      border-radius: 45% 45% 25% 25%;
      background: #8060b1;
      box-shadow: 0 2px #202722;
      content: "";
    }

    .player-hood {
      position: absolute;
      inset: 0 12% 24%;
      border: 1px solid #302340;
      border-radius: 50% 50% 42% 42%;
      background: #a688df;
    }

    .player-face {
      position: absolute;
      inset: 21% 12% 10%;
      border-radius: 46%;
      background: #ffdea8;
    }

    .player-eye {
      position: absolute;
      top: 24%;
      width: 29%;
      height: 39%;
      border-radius: 50%;
      background: radial-gradient(circle at 52% 52%, #302339 0 30%, #fff8e8 38%);
    }

    .player-eye:first-child { left: 14%; }
    .player-eye:last-child { right: 14%; }

    .player-face::after {
      position: absolute;
      inset: 65% 40% 9%;
      border-radius: 50%;
      background: #663746;
      content: "";
    }

    .player::after {
      position: absolute;
      inset: 10% 4% 64% 79%;
      transform: rotate(20deg);
      border-radius: 65% 0 65% 65%;
      background: #a2e7fa;
      content: "";
    }
  </style>
</head>
<body>
  <main>
    <h1>잿빛 지하묘</h1>
    <div id="room" class="room" role="img" aria-label="북쪽 중앙에 문이 있고, 보라색 후드를 쓴 모험가가 있는 돌 던전 방"></div>
    <p class="controls-hint">방향키로 이동하세요. 두 방향키를 함께 누르면 대각선으로 이동합니다.</p>
  </main>

  <template id="player-template">
    <div class="player-anchor">
      <div class="player">
        <div class="player-hood">
          <div class="player-face">
            <span class="player-eye"></span>
            <span class="player-eye"></span>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script>
    'use strict';

    // 배열의 한 줄은 지도의 가로 한 줄이고, 문자 하나는 타일 한 칸입니다.
    // 위치는 roomMap[y][x]로 읽습니다. x와 y는 왼쪽 위에서 0부터 시작합니다.
    // 모든 줄의 길이를 같게 유지하고, 문자만 바꾸면 방의 배치를 수정할 수 있습니다.
    const roomMap = [
      '######D######',
      '#...........#',
      '#..#.....#..#',
      '#...........#',
      '#...........#',
      '#..#.....#..#',
      '#...........#',
      '#...........#',
      '#############',
    ];

    // 지도 기호에 대응하는 CSS 클래스를 한곳에서 관리합니다.
    const tileTypes = { '#': 'wall', '.': 'floor', D: 'door' };
    const room = document.getElementById('room');
    room.style.setProperty('--columns', roomMap[0].length);

    // 바깥 반복문은 행을, 안쪽 반복문은 그 행의 칸을 순회합니다.
    // 지도 데이터를 읽어 화면 요소를 만드는 과정을 렌더링이라고 합니다.
    for (const row of roomMap) {
      for (const symbol of row) {
        const tile = document.createElement('div');
        tile.classList.add('tile', tileTypes[symbol]);
        room.append(tile);
      }
    }

    function isFloor(x, y) {
      return roomMap[y]?.[x] === '.';
    }

    let playerPosition = { x: 6, y: 7 };
    if (!isFloor(playerPosition.x, playerPosition.y)) {
      throw new Error('캐릭터 시작 위치는 바닥 타일이어야 합니다.');
    }

    const playerTemplate = document.getElementById('player-template');
    const playerAnchor = playerTemplate.content.firstElementChild.cloneNode(true);
    room.append(playerAnchor);
    renderPlayer();

    const movementByKey = new Map([
      ['ArrowUp', { dx: 0, dy: -1 }],
      ['ArrowDown', { dx: 0, dy: 1 }],
      ['ArrowLeft', { dx: -1, dy: 0 }],
      ['ArrowRight', { dx: 1, dy: 0 }],
    ]);

    const heldKeys = new Set();
    const tileTravelTimeMs = 130;
    const maxFrameElapsedMs = 50;
    let queuedKey;
    let step;
    let distanceTraveled = 0;
    let previousFrameTime;
    let isAnimating = false;

    function getNextStep() {
      const activeKeys = new Set(heldKeys);
      if (queuedKey) activeKeys.add(queuedKey);
      queuedKey = undefined;

      let dx = 0;
      let dy = 0;
      for (const key of activeKeys) {
        const movement = movementByKey.get(key);
        dx += movement.dx;
        dy += movement.dy;
      }
      if (dx === 0 && dy === 0) return;

      const { x, y } = playerPosition;
      if (dx !== 0 && dy !== 0) {
        const horizontalOpen = isFloor(x + dx, y);
        const verticalOpen = isFloor(x, y + dy);
        if (!horizontalOpen || !verticalOpen || !isFloor(x + dx, y + dy)) {
          // 벽 모서리를 통과할 수 없으면 열린 축을 따라 이동합니다.
          const preferred = movementByKey.get([...activeKeys].at(-1));
          if (horizontalOpen && (!verticalOpen || preferred.dx !== 0)) {
            dy = 0;
          } else {
            dx = 0;
          }
        }
      }

      const nextX = x + dx;
      const nextY = y + dy;
      if (!isFloor(nextX, nextY)) return;

      return {
        x: nextX,
        y: nextY,
        dx,
        dy,
        distance: Math.hypot(dx, dy),
      };
    }

    function renderPlayer(offsetX = 0, offsetY = 0) {
      const screenX = (playerPosition.x + offsetX) * 100;
      const screenY = (playerPosition.y + offsetY) * 100;
      playerAnchor.style.transform = `translate3d(${screenX}%, ${screenY}%, 0)`;
    }

    function animateMovement(frameTime) {
      step ??= getNextStep();
      // 프레임이 오래 지연된 뒤 한꺼번에 이동하는 거리를 제한합니다.
      const elapsed = Math.max(0, Math.min(frameTime - previousFrameTime, maxFrameElapsedMs));
      previousFrameTime = frameTime;
      distanceTraveled += elapsed / tileTravelTimeMs;

      // 한 프레임에 칸 경계를 넘어가도 남은 이동량을 다음 칸에 반영합니다.
      while (step && distanceTraveled >= step.distance) {
        playerPosition = { x: step.x, y: step.y };
        distanceTraveled -= step.distance;
        step = getNextStep();
      }

      if (!step) {
        distanceTraveled = 0;
        renderPlayer();
        isAnimating = false;
        return;
      }

      // 대각선은 더 긴 거리만큼 시간을 써서 직선 이동과 같은 속도를 유지합니다.
      const progress = distanceTraveled / step.distance;
      renderPlayer(step.dx * progress, step.dy * progress);
      requestAnimationFrame(animateMovement);
    }

    function startMovement() {
      if (isAnimating) return;
      isAnimating = true;
      // 프레임이 시작될 때까지 들어온 방향키를 함께 읽습니다.
      previousFrameTime = performance.now();
      requestAnimationFrame(animateMovement);
    }

    document.addEventListener('keydown', (event) => {
      if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
      if (!movementByKey.has(event.key)) return;

      event.preventDefault();
      if (event.repeat) return;

      heldKeys.add(event.key);
      // 이동 중에 짧게 누른 방향도 다음 칸부터 한 번 반영합니다.
      queuedKey = event.key;
      startMovement();
    });

    document.addEventListener('keyup', (event) => {
      if (heldKeys.delete(event.key)) startMovement();
    });

    window.addEventListener('blur', () => {
      heldKeys.clear();
      queuedKey = undefined;
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>규칙 기반 던전</title>
  <style>
    /* 화면에 여유가 있으면 방을 가로·세로 중앙에 배치한다. */
    body {
      display: grid;
      place-items: safe center;
      min-height: 100dvh;
      box-sizing: border-box;
      margin: 0;
      padding: 9px 12px;
      background: #111922;
    }

    /* 타일을 격자로 배치하고, 바닥색과 둥근 모서리를 적용한다. */
    #dungeon {
      display: grid;
      width: max-content;
      overflow: hidden;
      border-radius: 8px;
      background: #233341;
    }

    /* 방의 안쪽 가장자리에 20px 두께의 벽을 그린다. */
    #dungeon {
      box-shadow: inset 0 0 0 20px #3e5263;
    }
    
  </style>
</head>
<body>
  <!-- 던전 타일을 추가할 영역을 만든다. -->
  <div id="dungeon" role="img" aria-label="벽으로 둘러싸인 사각형 던전 방"></div>

  <script>
    function createDungeon(width, height) {
      const dungeon = [];

      // 위에서 아래로 한 행씩 생성한다.
      for (let y = 0; y < height; y++) {
        const row = [];

        // 현재 행을 왼쪽에서 오른쪽으로 한 칸씩 채운다.
        for (let x = 0; x < width; x++) {
          // 첫 행, 마지막 행, 첫 열, 마지막 열을 테두리로 판단한다.
          const isBorder =
            y === 0 || y === height - 1 ||
            x === 0 || x === width - 1;

          // 테두리에는 벽을, 안쪽에는 바닥을 배치한다.
          row.push(isBorder ? "#" : ".");
        }

        // 완성된 행을 던전에 추가한다.
        dungeon.push(row);
      }

      return dungeon;
    }

    // 가로 15칸, 세로 10칸짜리 던전을 생성한다.
    const dungeon = createDungeon(15, 10);

    const room = document.getElementById("dungeon");

    // 벽과 바닥을 포함한 모든 칸을 가로·세로 40px로 지정한다.
    const tileSize = 40;
    room.style.gridTemplateColumns = `repeat(${dungeon[0].length}, ${tileSize}px)`;
    room.style.gridTemplateRows = `repeat(${dungeon.length}, ${tileSize}px)`;

    // 던전의 각 칸을 만들고, 벽에만 벽 색상을 적용한다.
    for (const row of dungeon) {
      for (const cell of row) {
        const tile = document.createElement("div");
        if (cell === "#") {
          tile.className = "wall";
        }
        room.append(tile);
      }
    }
  </script>
</body>
</html>
